<body><title>Brand Bites</title>

<style>
/* Layout: "stories" reader, EN/ES. Home = one big Play button + brand circles + simple list; the viewer is a full-screen overlay: soft brand-tinted stage with a big logo, then a white sheet with one sentence, three big key facts and "why it's smart". Tap/swipe to move, progress bars on top.
   Palette "Chicle y menta" (chosen 2026-10-21): bubblegum pink for the logo and name, mint for Start/Next and highlights, deep pink for small text accents. */
:root {
  --bg: #fff4f8;
  --surface: #ffffff;
  --ink: #2b1a24;
  --muted: #71606a;
  --rule: #f3dce6;
  --accent: #c2305f;
  --accent-ink: #ffffff;
  --accent-soft: #fde4ee;
  --sun: #ffc83d;
  --sun-ink: #2b2100;
  --logo: #e2457a;
  --crumb: #1fa884;
  --pop: #13866a;
  --pop-ink: #ffffff;
  --hl: #ddf5ec;
  --hl-ink: #0d4a38;
  --shadow: 0 1px 2px rgba(43,26,36,.05), 0 10px 30px rgba(43,26,36,.08);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* Light only, by design: no dark mode, even when the phone is in dark mode. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
button, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Logo tile */
.lg { width: 48px; height: 48px; border-radius: 13px; overflow: hidden; display: grid; place-items: center; background: var(--b); color: var(--f); font-family: var(--display); font-weight: 800; font-size: 10px; line-height: 1.05; text-align: center; padding: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); flex: none; word-break: break-word; }
.lg.img { padding: 0; background: #fff; }
.lg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lg.img.wide { padding: 6px; }
.lg.img.wide img { object-fit: contain; }

/* Language switch */
.lang { display: inline-flex; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; flex: none; }
.lang button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.vhead .lang { background: color-mix(in srgb, var(--surface) 70%, transparent); border-color: transparent; }

/* ---------- Home ---------- */
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 20px; white-space: nowrap; margin-right: auto; }
.mark { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex: none; }
.week { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 10px; font-weight: 600; font-size: 15px; max-width: 52vw; color: var(--ink); }

.bar .lang { margin-left: auto; }
.hero { padding-block: 8px 8px; display: grid; gap: 16px; justify-items: center; text-align: center; }
.hero .word > span:last-child { white-space: nowrap; }
.hero .word { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; font-size: clamp(38px, 11.5vw, 84px); line-height: 1; font-weight: 800; letter-spacing: -.035em; }
.hero .word b { color: var(--logo); }
.logo-a { display: block; width: clamp(56px, 15vw, 84px); height: clamp(56px, 15vw, 84px); flex: none; filter: drop-shadow(0 8px 18px color-mix(in srgb, var(--logo) 30%, transparent)); }
.hero .lead { margin: 0; font-family: var(--display); font-size: clamp(22px, 5.6vw, 30px); line-height: 1.15; font-weight: 700; color: var(--ink); max-width: 22ch; letter-spacing: -.01em; }
.hero .lead b { color: var(--accent); }
.hero p { margin: 0; font-size: 19px; color: var(--muted); max-width: 30ch; }
.play { display: inline-flex; align-items: center; gap: 12px; border: 0; cursor: pointer; background: var(--pop); color: var(--pop-ink); font-weight: 800; font-family: var(--display); font-size: 24px; padding: 18px 34px 18px 26px; border-radius: 999px; box-shadow: 0 10px 30px color-mix(in srgb, var(--pop) 35%, transparent); }
.play svg { flex: none; }
.play:hover { transform: scale(1.03); }
.circles { display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 10px; max-width: 100%; scrollbar-width: none; }
.circles::-webkit-scrollbar { display: none; }
.circles button { border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 6px; justify-items: center; width: 72px; flex: none; font-size: 12px; font-weight: 600; color: var(--muted); }
.circles .ring { padding: 3px; border-radius: 20px; background: linear-gradient(135deg, var(--crumb), var(--logo)); }
.circles .ring.seen { background: var(--rule); }
.circles .lg { width: 60px; height: 60px; border-radius: 17px; border: 3px solid var(--bg); box-shadow: none; }
.note { margin: 0; font-size: 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--rule); border-radius: 12px; padding: 8px 12px; }

.bigidea { margin-block: 26px 6px; background: var(--hl); color: var(--hl-ink); border-radius: 22px; padding: 22px; display: grid; gap: 6px; }
.bigidea small { font-weight: 800; font-size: 14px; }
.bigidea h2 { font-size: clamp(24px, 5vw, 30px); line-height: 1.15; }
.bigidea p { margin: 0; font-size: 16px; }

.section { padding-top: 34px; display: grid; gap: 12px; }
.section h2 { font-size: 26px; }
.section > p { margin: 0; color: var(--muted); font-size: 16px; }
.rows { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border: 0; border-top: 1px solid var(--rule); background: none; width: 100%; text-align: left; cursor: pointer; text-decoration: none; color: var(--ink); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.row .t { font-weight: 700; font-size: 17px; line-height: 1.3; display: block; }
.row small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.row .go { color: var(--accent); font-weight: 800; font-size: 20px; }
.hot { display: inline-block; background: var(--pop); color: var(--pop-ink); font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
.showall { width: 100%; border: 0; border-top: 1px solid var(--rule); background: none; padding: 14px; font-weight: 700; color: var(--accent); cursor: pointer; }
footer { margin-top: 40px; padding-block: 24px 48px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; display: grid; gap: 8px; }
footer p { margin: 0; }

/* ---------- Story viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--ink) 88%, #000); display: flex; justify-content: center; }
.phone { position: relative; width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: color-mix(in srgb, var(--b) 15%, var(--bg)); color: var(--ink); overflow-x: hidden; overflow-y: auto; touch-action: pan-y; }
@media (min-width: 560px) { .phone { margin-block: 16px; height: calc(100% - 32px); border-radius: 26px; } }
.vtop { padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 6px; display: grid; gap: 10px; position: relative; z-index: 2; }
.bars { display: flex; gap: 4px; }
.bars i { flex: 1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 15%, transparent); }
.bars i.on { background: var(--logo); }
.vhead { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.vhead #count { margin-right: auto; }
.vclose { border: 0; background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; flex: none; }
.stage { flex: 1 1 auto; min-height: 120px; display: grid; place-items: center; align-content: center; gap: 10px; padding: 6px 20px 18px; text-align: center; position: relative; }
.stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 80% 0%, rgba(255,255,255,.22), transparent 55%); pointer-events: none; }
.stage .lg { width: clamp(88px, 24vw, 124px); height: clamp(88px, 24vw, 124px); border-radius: 28px; font-size: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.25); position: relative; }
.stage .name { font-family: var(--display); font-weight: 800; font-size: 24px; position: relative; }
.stage .tag { position: relative; font-size: 14px; font-weight: 700; background: color-mix(in srgb, var(--surface) 75%, transparent); padding: 4px 12px; border-radius: 999px; }
.stage .tag.hot2 { background: var(--pop); color: var(--pop-ink); }
.sheet { background: var(--surface); color: var(--ink); border-radius: 26px 26px 0 0; padding: 22px 20px 14px; display: grid; gap: 14px; position: relative; z-index: 2; }
@media (min-width: 560px) { .sheet { border-radius: 26px 26px 0 0; margin: 0 10px; } }
.sheet h2 { font-size: clamp(23px, 6.2vw, 29px); line-height: 1.15; font-weight: 800; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(0,1fr)); grid-auto-flow: column; gap: 8px; }
.fact { background: var(--bg); border-radius: 14px; padding: 10px 8px; text-align: center; display: grid; gap: 2px; align-content: start; }
.fact b { font-family: var(--display); font-weight: 800; font-size: clamp(19px, 5.4vw, 24px); line-height: 1.05; color: var(--accent); overflow-wrap: anywhere; }
.fact span { font-size: 13px; line-height: 1.25; color: var(--muted); }
.smart { margin: 0; background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; font-size: 16px; line-height: 1.4; }
.smart b { display: block; color: var(--accent); font-size: 13px; font-weight: 800; }
.vbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.vbtns a, .vbtns button { flex: 1 1 auto; text-align: center; text-decoration: none; border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 16px; cursor: pointer; border: 1px solid var(--rule); background: none; color: var(--ink); }
.vbtns .main { background: var(--ink); color: var(--surface); border-color: var(--ink); flex: 1 1 100%; }
.vbtns .wa { background: #e7f8ee; border-color: #bfe8cf; color: #0b5d33; }
.vnav { display: flex; justify-content: space-between; align-items: center; position: sticky; bottom: 0; z-index: 4; background: var(--surface); padding: 10px 20px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); }
@media (min-width: 560px) { .vnav { margin: 0 10px 10px; border-radius: 0 0 26px 26px; border-top: 0; } }
@media (max-height: 820px) {
  .stage { padding-bottom: 12px; gap: 6px; }
  .stage .lg { width: 72px; height: 72px; border-radius: 20px; }
  .stage .name { font-size: 20px; }
  .sheet { padding-top: 16px; gap: 10px; }
  .sheet h2 { font-size: 22px; }
}
.vnav button { border: 0; background: var(--pop); color: var(--pop-ink); border-radius: 999px; padding: 10px 18px; font-weight: 800; cursor: pointer; font-size: 16px; }
.vnav button.back { background: none; color: var(--muted); padding-inline: 6px; }
.vnav button:disabled { visibility: hidden; }
.tapzone { position: absolute; top: 90px; height: 220px; width: 30%; z-index: 1; cursor: pointer; }
.tapzone.l { left: 0; } .tapzone.r { right: 0; width: 40%; }
.hint { position: absolute; left: 50%; top: 30%; transform: translate(-50%,-50%); z-index: 3; background: rgba(0,0,0,.75); color: #fff; padding: 14px 18px; border-radius: 16px; font-weight: 700; font-size: 16px; text-align: center; pointer-events: none; width: max-content; max-width: 85%; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 14px; font-size: 15px; z-index: 80; max-width: calc(100% - 32px); user-select: all; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) {
  .phone.anim .stage > *, .phone.anim .sheet { animation: rise .28s ease both; }
  .phone.anim .sheet { animation-delay: .05s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .play:hover { transition: transform .15s; }
}

                set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
let seen = store.get("radar-seen", {});
let lang = store.get("radar-lang", "en") === "es" ? "es" : "en";
let cur = 0, pos = 0, moreOpen = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s || "").replace(/<[^>]+>/g, "");
const L = () => T[lang];
const issue = () => ISSUES[cur];
const es = x => (lang === "es" && x && x.es) || {};
const easy = x => es(x).easy || es(x).t || x.easy || x.t;   // one simple sentence: what happened
const smart = x => es(x).smart || x.smart || x.lesson;       // one simple sentence: why it's a clever idea
const facts = x => (es(x).facts && es(x).facts.length ? es(x).facts : x.facts) || [];
const region = r => L().regions[r] || r;
const seenKey = x => issue().issueLabel + "|" + x.id;
const dateTxt = d => lang === "es" ? String(d).replace(/\b([A-Z][a-z]{2})\b/g, m => MONTH_ES[m] || m) : d;
const weekName = iss => `${L().week} ${dateTxt(iss.dateLabel.replace(/\s\d{4}$/, ""))}`;
const trend = iss => (lang === "es" && iss.trend.es) || iss.trend;
const hasES = iss => iss.stories.some(x => x.es);

function logo(x){
  const src = x.logo && LOGOS[x.logo];
  return src ? `<div class="lg img${LOGO_WIDE[x.logo]?" wide":""}" style="--b:${x.b};--f:${x.f}"><img src="${src}" alt=""></div>`
             : `<div class="lg" style="--b:${x.b};--f:${x.f}" aria-hidden="true">${esc(x.short || x.brand)}</div>`;
}
function toast(msg, sticky){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>{ t.hidden = true; }, sticky ? 9000 : 2200); }

/* ---------- Home ---------- */
function renderHome(){
  const iss = issue(), S = iss.stories, t = L(), mins = Math.max(2, Math.round(S.length * 0.3));
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("heroTitle").innerHTML = t.hero(S.length);
  $("heroSub").textContent = t.heroSub(mins);
  const done = S.filter(x=>seen[seenKey(x)]).length;
  $("playLabel").textContent = done === 0 ? t.start : done >= S.length ? t.again : t.keep;
  $("circles").innerHTML = S.map((x,i)=>`<button type="button" data-open="${i}" aria-label="${esc(x.brand)}"><span class="ring${seen[seenKey(x)]?" seen":""}">${logo(x)}</span>${esc(x.brand)}</button>`).join("");
  $("langNote").hidden = !(lang === "es" && !hasES(iss)); $("langNote").textContent = t.noES;
  $("ideaLabel").textContent = t.idea; $("ideaTitle").innerHTML = trend(iss).title; $("ideaText").innerHTML = trend(iss).text;
  $("allTitle").textContent = t.all; $("allSub").textContent = t.allSub;
  $("rows").innerHTML = S.map((x,i)=>`<button class="row" type="button" data-open="${i}">${logo(x)}<span><span class="t">${esc(strip(easy(x)))}${x.hot?`<span class="hot">${t.top}</span>`:""}</span><small>${esc(x.brand)} · ${esc(region(x.region))}</small></span><span class="go" aria-hidden="true">›</span></button>`).join("");
  renderMore();
  $("pastTitle").textContent = t.past;
  $("pastRows").innerHTML = ISSUES.map((w,i)=>`<button class="row" type="button" data-week="${i}"><span class="lg" style="--b:var(--accent-soft);--f:var(--accent)">${num(w.issueLabel)}</span><span><span class="t">${trend(w).title}</span><small>${esc(weekName(w))} · ${w.stories.length} ${t.stories}${i===cur?" · "+t.here:""}</small></span><span class="go" aria-hidden="true">›</span></button>`).join("");
  $("weekLabel").textContent = t.chooseWeek;
  $("week").innerHTML = ISSUES.map((w,i)=>`<option value="${i}"${i===cur?" selected":""}>${esc(weekName(w))}${i===0?` (${t.newW})`:""}</option>`).join("");
  $("howPick").innerHTML = t.how;
  $("sources").textContent = iss.sources ? t.sources + iss.sources : "";
  $("close").setAttribute("aria-label", t.close);
}
function renderMore(){
  const M = issue().more || [], t = L();
  $("moreSec").hidden = !M.length;
  if (!M.length) return;
  const shown = moreOpen || M.length <= 10 ? M : M.slice(0, 8);
  $("moreTitle").textContent = t.more; $("moreSub").textContent = t.moreSub(M.length);
  $("moreRows").innerHTML = shown.map(x=>`<a class="row" href="${x.url}" target="_blank" rel="noopener">${logo(x)}<span><span class="t">${esc(strip(easy(x)))}</span><small>${esc(x.brand)} · ${esc(x.src)}</small></span><span class="go" aria-hidden="true">↗</span></a>`).join("")
    + (shown.length < M.length ? `<button class="showall" type="button" id="moreBtn">${t.showAll(M.length)}</button>` : "");
}

/* ---------- Viewer ---------- */
function openViewer(i){
  pos = Math.max(0, Math.min(i, issue().stories.length - 1));
  $("viewer").hidden = false; document.body.style.overflow = "hidden";
  renderStory();
  if (!store.get("radar-hint", false)) { $("hint").innerHTML = L().hint; $("hint").hidden = false; setTimeout(()=>{ $("hint").hidden = true; }, 2600); store.set("radar-hint", true); }
  $("close").focus();
}
function closeViewer(){ $("viewer").hidden = true; document.body.style.overflow = ""; renderHome(); }
function renderStory(){
  const S = issue().stories, x = S[pos], t = L(), F = facts(x).slice(0, 3);
  seen[seenKey(x)] = 1; store.set("radar-seen", seen);
  const ph = $("phone"); ph.style.setProperty("--b", x.b); ph.style.setProperty("--f", x.f);
  $("viewer").setAttribute("aria-label", t.story(pos+1, S.length));
  $("bars").innerHTML = S.map((_,i)=>`<i class="${i<=pos?"on":""}"></i>`).join("");
  $("count").textContent = t.story(pos+1, S.length);
  $("stage").innerHTML = `${logo(x)}<div class="name">${esc(x.brand)}</div><span class="tag${x.hot?" hot2":""}">${x.hot ? t.top + " · " : ""}${esc(region(x.region))}</span>`;
  const last = pos === S.length - 1;
  $("sheet").innerHTML = `<h2>${esc(strip(easy(x)))}</h2>
    ${F.length ? `<div class="facts">${F.map(f=>`<div class="fact"><b>${esc(f.v)}</b><span>${esc(f.l)}</span></div>`).join("")}</div>` : ""}
    <p class="smart"><b>${t.smart}</b>${esc(strip(smart(x)))}</p>
    <div class="vbtns"><a class="main" href="${x.url}" target="_blank" rel="noopener">${t.read}</a><a class="wa" href="https://wa.me/?text=${encodeURIComponent("Brand Bites: " + strip(easy(x)) + " " + SITE_URL + "#" + x.id)}" target="_blank" rel="noopener">${t.wa}</a><button type="button" data-share="${x.id}">${t.share}</button></div>`;
  $("vnav").innerHTML = `<button class="back" type="button" data-nav="-1"${pos===0?" disabled":""}>${t.back}</button><button type="button" data-nav="1">${last ? t.finish : t.next}</button>`;
  ph.scrollTop = 0;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  ph.classList.remove("anim"); void ph.offsetWidth; ph.classList.add("anim");
}
function step(d){
  const n = issue().stories.length;
  if (pos + d >= n) { closeViewer(); toast(L().done); ((issue().more||[]).length ? $("moreSec") : $("all")).scrollIntoView({block:"start"}); return; }
  if (pos + d < 0) return;
  pos += d; renderStory();
}
function setLang(l){
  lang = l; store.set("radar-lang", l);
  renderHome(); if (!$("viewer").hidden) renderStory();
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lang]"); if (lb) { setLang(lb.dataset.lang); return; }
  const o = e.target.closest("[data-open]"); if (o) { openViewer(+o.dataset.open); return; }
  const n = e.target.closest("[data-nav]"); if (n) { step(+n.dataset.nav); return; }
  const w = e.target.closest("[data-week]"); if (w) { cur = +w.dataset.week; moreOpen = false; renderHome(); window.scrollTo({top:0}); return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { const url = SITE_URL + "#" + sh.dataset.share;
    try { navigator.clipboard.writeText(url).then(()=>toast(L().copied), ()=>toast(url, true)); } catch(err) { toast(url, true); } return; }
  if (e.target.id === "moreBtn") { moreOpen = true; renderMore(); }
});
$("playBtn").addEventListener("click", () => { const S = issue().stories; const i = S.findIndex(x=>!seen[seenKey(x)]); openViewer(i < 0 ? 0 : i); });
$("close").addEventListener("click", closeViewer);
$("week").addEventListener("change", e => { cur = +e.target.value; moreOpen = false; renderHome(); });
document.addEventListener("keydown", e => {
  if ($("viewer").hidden) return;
  if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "Escape") closeViewer();
});
let tx = null, ty = null;
$("phone").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("phone").addEventListener("touchend", e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
}, { passive: true });

renderHome();
const h = (location.hash || "").slice(1);
if (h) { const wi = ISSUES.findIndex(iss => iss.stories.some(s=>s.id===h)); if (wi >= 0) { cur = wi; renderHome(); openViewer(issue().stories.findIndex(s=>s.id===h)); } }
</script>

<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js')); }</script>
</body>
</html>
